<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Node di Browser</title>
<style>
:root{
  --bg:#16222d; --panel:#1e2e3c; --line:#33475a; --ink:#e9eef3; --dim:#93a6b7;
  --accent:#f0c674; --accent-ink:#2a2107; --ok:#8fd0a8; --err:#ef8a80;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
#status{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--dim)}
#status[data-kind="ok"]{color:var(--ok);border-color:#3f6653}
#status[data-kind="busy"]{color:var(--accent);border-color:#6b5a30}
#status[data-kind="err"]{color:var(--err);border-color:#7a4540}

.bar{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px}

#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:14px;color:var(--dim);cursor:pointer}
.tab[aria-current="true"]{background:var(--panel);color:var(--ink);border-color:var(--dim)}
.tab.plus{color:var(--accent);border-style:dashed}

#editor{width:100%;height:38vh;min-height:220px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:16px;line-height:1.5;tab-size:2;white-space:pre;overflow:auto}

.actions{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 10px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{flex:none;padding:9px 12px;font-weight:500;font-size:14px;color:var(--dim)}
.btn:active{transform:translateY(1px)}

#cmd{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:var(--mono);font-size:16px}

.panel-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--dim)}
#out{margin:0;height:32vh;min-height:180px;overflow:auto;background:#0f1922;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:14px;line-height:1.5;color:var(--ink)}
#out .ln{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
#out .qrbox{overflow:hidden;padding:6px 0;line-height:1;font-size:14px}
#out .qrbox .ln{white-space:pre;word-break:normal;min-height:0;line-height:1}
#out .cmd{color:var(--accent)}
#out .ok{color:var(--ok)}
#out .err{color:var(--err)}

#frame{width:100%;height:320px;border:1px solid var(--line);border-radius:10px;background:#fff}
</style>
</head>
<body>
<main>
  <header>
    <h1>Node di Browser</h1>
    <span id="status" role="status">Menyiapkan…</span>
  </header>

  <div class="bar">
    <select id="tpl" aria-label="Template proyek">
      <option value="">Muat template…</option>
      <option value="hello">Halo Node (tanpa paket)</option>
      <option value="express">Server Express</option>
      <option value="qr">QR di terminal</option>
    </select>
  </div>

  <div id="tabs" role="tablist" aria-label="Berkas proyek"></div>
  <textarea id="editor" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Editor kode"></textarea>

  <div class="actions">
    <button class="btn" id="install" type="button">Install</button>
    <button class="btn primary" id="run" type="button">Jalankan</button>
    <button class="btn" id="stop" type="button">Stop</button>
  </div>
  <input id="cmd" value="node index.js" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Perintah yang dijalankan">

  <div class="panel-head">
    <span>Output</span>
    <span>
      <button class="btn small" id="delfile" type="button">Hapus file</button>
      <button class="btn small" id="clear" type="button">Bersihkan</button>
    </span>
  </div>
  <div id="out" role="log" aria-live="polite"></div>

  <section id="preview" hidden>
    <div class="panel-head"><span>Pratinjau server</span></div>
    <iframe id="frame" title="Pratinjau server" allow="cross-origin-isolated"></iframe>
  </section>
</main>

<script type="module">
const TEMPLATES = {
  hello: {
    cmd: 'node index.js',
    files: {
      'index.js': `const os = require('os');

console.log('Node', process.version);
console.log('Platform:', os.platform());

const total = [1, 2, 3, 4].reduce((a, b) => a + b, 0);
console.log('Jumlah:', total);
`,
      'package.json': JSON.stringify({ name: 'app', version: '1.0.0' }, null, 2) + '\n'
    }
  },
  qr: {
    cmd: 'npm install && node index.js',
    files: {
      'index.js': `const qrcode = require('qrcode-terminal');

const teks = 'https://vercel.com';

console.log('QR ukuran biasa:');
qrcode.generate(teks);

console.log('QR ukuran kecil:');
qrcode.generate(teks, { small: true });
`,
      'package.json': JSON.stringify({
        name: 'app', version: '1.0.0',
        dependencies: { 'qrcode-terminal': '^0.12.0' }
      }, null, 2) + '\n'
    }
  },
  express: {
    cmd: 'npm install && node index.js',
    files: {
      'index.js': `const express = require('express');
const app = express();

app.get('/', (req, res) => {
  res.send('<h1>Halo dari Express di dalam browser</h1>');
});

app.listen(3000, () => console.log('Server jalan di port 3000'));
`,
      'package.json': JSON.stringify({
        name: 'app', version: '1.0.0',
        dependencies: { express: '^4.19.2' }
      }, null, 2) + '\n'
    }
  }
};

const $ = (s) => document.querySelector(s);
const out = $('#out'), editor = $('#editor'), tabs = $('#tabs'), statusEl = $('#status');
const cmdEl = $('#cmd'), preview = $('#preview'), frame = $('#frame');
const KEY = 'nodeRunner.project';

let wc = null, bootPromise = null, files = {}, current = 'index.js', proc = null, runId = 0, saveTimer = null;

/* ---------- util ---------- */
function setStatus(text, kind) { statusEl.textContent = text; statusEl.dataset.kind = kind || ''; }

/* Output bergaya terminal: baris hidup bisa ditimpa, warna ANSI didukung, dan QR tampil utuh */
const PAL = ['#000000','#cd3131','#0dbc79','#e5e510','#2472c8','#bc3fbc','#11a8cd','#e5e5e5',
             '#666666','#f14c4c','#23d18b','#f5f543','#3b8eea','#d670d6','#29b8db','#ffffff'];
const DEF_FG = '#e9eef3', DEF_BG = '#0f1922';
const BLOCK = /[\u2580-\u259f]/;

let liveEl = null, cells = [];
let sgr = { fg: null, bg: null, bold: false, inv: false }, css = '';

function xterm256(n) {
  if (n < 16) return PAL[n];
  if (n >= 232) { const g = 8 + (n - 232) * 10; return `rgb(${g},${g},${g})`; }
  const c = n - 16, v = (x) => (x ? 55 + x * 40 : 0);
  return `rgb(${v(Math.floor(c / 36))},${v(Math.floor(c / 6) % 6)},${v(c % 6)})`;
}

function cssOf() {
  let fg = sgr.fg, bg = sgr.bg;
  if (sgr.inv) { const f = fg || DEF_FG, b = bg || DEF_BG; fg = b; bg = f; }
  let r = '';
  if (fg) r += `color:${fg};`;
  if (bg) r += `background:${bg};`;
  if (sgr.bold) r += 'font-weight:700;';
  return r;
}

function applySgr(p) {
  if (!p.length) p = [0];
  for (let i = 0; i < p.length; i++) {
    const n = p[i];
    if (n === 0) sgr = { fg: null, bg: null, bold: false, inv: false };
    else if (n === 1) sgr.bold = true;
    else if (n === 22) sgr.bold = false;
    else if (n === 7) sgr.inv = true;
    else if (n === 27) sgr.inv = false;
    else if (n >= 30 && n <= 37) sgr.fg = PAL[n - 30];
    else if (n >= 90 && n <= 97) sgr.fg = PAL[n - 90 + 8];
    else if (n === 39) sgr.fg = null;
    else if (n >= 40 && n <= 47) sgr.bg = PAL[n - 40];
    else if (n >= 100 && n <= 107) sgr.bg = PAL[n - 100 + 8];
    else if (n === 49) sgr.bg = null;
    else if (n === 38 || n === 48) {
      const key = n === 38 ? 'fg' : 'bg';
      if (p[i + 1] === 5) { sgr[key] = xterm256(p[i + 2] || 0); i += 2; }
      else if (p[i + 1] === 2) { sgr[key] = `rgb(${p[i + 2] || 0},${p[i + 3] || 0},${p[i + 4] || 0})`; i += 4; }
    }
  }
  css = cssOf();
}

function newLive() {
  liveEl = document.createElement('div');
  liveEl.className = 'ln';
  cells = [];
  out.appendChild(liveEl);
}

function paint(el, list) {
  el.replaceChildren();
  let i = 0;
  while (i < list.length) {
    const st = list[i].s;
    let j = i, txt = '';
    while (j < list.length && list[j].s === st) { txt += list[j].c; j++; }
    if (st) {
      const sp = document.createElement('span');
      sp.style.cssText = st;
      sp.textContent = txt;
      el.appendChild(sp);
    } else {
      el.appendChild(document.createTextNode(txt));
    }
    i = j;
  }
}

// perkecil font satu blok QR sampai semua barisnya muat lebar layar
function fitQr(box) {
  box.style.fontSize = '14px';
  const need = box.scrollWidth, have = box.clientWidth;
  if (need > have && have > 0) box.style.fontSize = Math.max(3, 14 * have / need * 0.98).toFixed(2) + 'px';
}

function commitLine() {
  let text = cells.map((c) => c.c).join('');
  if (/^[\\|\/-]$/.test(text)) { cells = []; text = ''; }
  const nice = pretty(text);
  if (nice !== text) cells = [...nice].map((c) => ({ c, s: '' }));
  const special = cells.filter((c) => BLOCK.test(c.c) || c.s.includes('background')).length;
  paint(liveEl, cells);
  if (special >= 10) {
    let box = liveEl.previousSibling;
    if (!(box && box.classList && box.classList.contains('qrbox'))) {
      box = document.createElement('div');
      box.className = 'qrbox';
      out.insertBefore(box, liveEl);
    }
    box.appendChild(liveEl);
    fitQr(box);
  }
  newLive();
}

function scrollDown() {
  while (out.childNodes.length > 400) out.removeChild(out.firstChild);
  out.scrollTop = out.scrollHeight;
}
function clearOut() { out.replaceChildren(); newLive(); }

// pesan dari halaman ini sendiri
function log(text, cls) {
  const clean = String(text).replace(/\r\n?/g, '\n');
  if (!clean) return;
  if (cells.length) commitLine();
  const lines = clean.split('\n');
  if (lines[lines.length - 1] === '') lines.pop();
  for (const line of lines) {
    const d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    d.textContent = line;
    out.insertBefore(d, liveEl);
  }
  scrollDown();
}

// ringkas log unduhan npm: "npm http fetch GET 200 https://.../express/-/express-4.19.2.tgz 90ms"
function pretty(line) {
  const m = line.match(/^npm http fetch GET (\d{3}) (\S+)/);
  if (!m || Number(m[1]) >= 400) return line;
  const tgz = m[2].match(/\/([^\/]+)\.tgz$/);
  if (tgz) return 'unduh ' + tgz[1];
  try { return 'cek ' + decodeURIComponent(m[2].replace(/^https?:\/\/[^\/]+\//, '')); } catch { return line; }
}

// keluaran proses (npm, node, dll)
const CTRL = /\u001b\[([0-9;?]*)([A-Za-z])|\u001b\][^\u0007\u001b]*(?:\u0007|\u001b\\)|\u001b[()][0-9A-Za-z]|\r\n|\r|\n|\u0008/g;
function term(data) {
  CTRL.lastIndex = 0;
  let last = 0, m;
  const put = (str) => { for (const ch of str) cells.push({ c: ch, s: css }); };
  while ((m = CTRL.exec(data))) {
    put(data.slice(last, m.index));
    last = CTRL.lastIndex;
    const t = m[0];
    if (t === '\n' || t === '\r\n') {
      commitLine();
    } else if (t === '\r') {
      cells = [];
    } else if (t === '\u0008') {
      cells.pop();
    } else if (m[2] === 'm') {
      applySgr(m[1] === '' ? [0] : m[1].split(';').map((x) => parseInt(x, 10) || 0));
    } else if (m[2] === 'D') {
      cells.length = Math.max(0, cells.length - (parseInt(m[1], 10) || 1));
    } else if (m[2] === 'G') {
      cells.length = Math.min(cells.length, Math.max(0, (parseInt(m[1], 10) || 1) - 1));
    }
  }
  put(data.slice(last));
  paint(liveEl, cells);
  scrollDown();
}
newLive();

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify({ files, cmd: cmdEl.value })); } catch {}
  }, 400);
}

/* ---------- WebContainer ---------- */
function ensureBoot() {
  if (!bootPromise) {
    bootPromise = (async () => {
      if (!window.crossOriginIsolated) {
        throw new Error('Browser ini belum mengaktifkan cross-origin isolation, jadi Node.js tidak bisa dijalankan. Coba Chrome di Android atau di desktop, dan pastikan vercel.json ikut ter-deploy.');
      }
      setStatus('Memulai Node…', 'busy');
      const { WebContainer } = await import('https://esm.sh/@webcontainer/api');
      wc = await WebContainer.boot();
      wc.on('server-ready', (port, url) => {
        frame.src = url;
        preview.hidden = false;
        log(`Server siap di port ${port}\n`, 'ok');
      });
      wc.on('error', (e) => log('Error: ' + e.message + '\n', 'err'));
      await syncFiles();
      setStatus('Siap', 'ok');
    })();
    bootPromise.catch((e) => {
      setStatus('Gagal', 'err');
      log(e.message + '\n', 'err');
    });
  }
  return bootPromise;
}

async function syncFiles() {
  for (const [name, content] of Object.entries(files)) {
    await wc.fs.writeFile(name, content);
  }
}

async function run(line) {
  line = (line || '').trim();
  if (!line) return;
  try { await ensureBoot(); } catch { return; }
  if (proc) { proc.kill(); proc = null; }
  const id = ++runId;
  await syncFiles();
  log('$ ' + line + '\n', 'cmd');
  setStatus('Berjalan…', 'busy');
  startTimer(id);

  for (const part of line.split('&&')) {
    const [cmd, ...args] = part.trim().split(/\s+/);
    if (!cmd) continue;
    if (cmd === 'npm' && ['install', 'i', 'ci'].includes(args[0]) && !args.includes('--no-progress')) {
      args.push('--no-progress', '--no-fund', '--no-audit', '--loglevel=http');
      log('Memasang paket, daftar unduhan muncul di bawah.\n');
    }
    let p;
    try {
      p = await wc.spawn(cmd, args, { env: { FORCE_COLOR: '1' } });
    } catch {
      log(`Perintah tidak dikenal: ${cmd}\n`, 'err');
      clearInterval(timer);
      setStatus('Siap', 'ok');
      return;
    }
    proc = p;
    p.output.pipeTo(new WritableStream({ write(d) { if (id === runId) term(d); } }));
    const code = await p.exit;
    if (id !== runId) return;
    if (code !== 0) { log(`Berhenti dengan kode ${code}\n`, 'err'); break; }
  }
  if (id === runId) { proc = null; clearInterval(timer); setStatus('Siap', 'ok'); }
}

let timer = null;
function startTimer(id) {
  clearInterval(timer);
  const t0 = Date.now();
  timer = setInterval(() => {
    if (id !== runId) { clearInterval(timer); return; }
    setStatus(`Berjalan… ${Math.floor((Date.now() - t0) / 1000)} dtk`, 'busy');
  }, 1000);
}

function stop() {
  runId++;
  clearInterval(timer);
  if (proc) { proc.kill(); proc = null; log('Dihentikan\n', 'err'); }
  if (wc) setStatus('Siap', 'ok');
}

/* ---------- editor & berkas ---------- */
function renderTabs() {
  tabs.replaceChildren();
  for (const name of Object.keys(files)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.textContent = name;
    if (name === current) b.setAttribute('aria-current', 'true');
    b.onclick = () => { current = name; editor.value = files[name]; renderTabs(); };
    tabs.appendChild(b);
  }
  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'tab plus';
  add.textContent = '+ File';
  add.onclick = addFile;
  tabs.appendChild(add);
}

function addFile() {
  const name = (prompt('Nama file baru (contoh: util.js)') || '').trim();
  if (!name) return;
  if (!/^[\w.-]+$/.test(name)) { log('Nama file hanya boleh huruf, angka, titik, garis bawah, dan strip.\n', 'err'); return; }
  if (files[name] !== undefined) { log(`File ${name} sudah ada.\n`, 'err'); return; }
  files[name] = '';
  current = name;
  editor.value = '';
  renderTabs();
  save();
}

function deleteFile() {
  if (Object.keys(files).length <= 1) { log('Proyek harus punya minimal satu file.\n', 'err'); return; }
  if (!confirm(`Hapus ${current}?`)) return;
  const gone = current;
  delete files[gone];
  if (wc) wc.fs.rm(gone, { force: true }).catch(() => {});
  current = Object.keys(files)[0];
  editor.value = files[current];
  renderTabs();
  save();
}

function loadTemplate(key) {
  const tpl = TEMPLATES[key];
  if (!tpl) return;
  if (!confirm('Ganti proyek sekarang dengan template ini?')) return;
  if (wc) for (const name of Object.keys(files)) wc.fs.rm(name, { force: true }).catch(() => {});
  files = { ...tpl.files };
  current = 'index.js';
  editor.value = files[current];
  cmdEl.value = tpl.cmd;
  renderTabs();
  if (wc) syncFiles();
  save();
}

/* ---------- event ---------- */
editor.addEventListener('input', () => { files[current] = editor.value; save(); });
cmdEl.addEventListener('input', save);
cmdEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(cmdEl.value); });
$('#run').onclick = () => run(cmdEl.value);
$('#install').onclick = () => run('npm install');
$('#stop').onclick = stop;
$('#clear').onclick = clearOut;
$('#delfile').onclick = deleteFile;
$('#tpl').onchange = (e) => { loadTemplate(e.target.value); e.target.value = ''; };

/* ---------- mulai ---------- */
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved && saved.files && Object.keys(saved.files).length) {
    files = saved.files;
    cmdEl.value = saved.cmd || 'node index.js';
  }
} catch {}
if (!Object.keys(files).length) files = { ...TEMPLATES.hello.files };
current = files['index.js'] !== undefined ? 'index.js' : Object.keys(files)[0];
editor.value = files[current];
renderTabs();
log('Edit kode, lalu tekan Jalankan.\n');
ensureBoot().catch(() => {});
</script>
</body>
</html>
